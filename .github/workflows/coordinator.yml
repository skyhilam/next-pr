name: Coordinator validation
on:
  pull_request:
    paths: ['next_pr/**', 'tests/**', 'scripts/**', '.github/workflows/coordinator.yml']
  push:
    branches: [main]
    paths: ['next_pr/**', 'tests/**', 'scripts/**', '.github/workflows/coordinator.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m next_pr --help
      - run: bash -n scripts/open-pr.sh scripts/check-pr.sh
